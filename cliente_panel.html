<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pedido | Ciencias Caffé</title>
    <link rel="stylesheet" href="css/estilos_cliente.css">
</head>
<body>

    <nav class="barra_navegacion">
        <div class="nav_wrapper">
            <div class="logo">
                <span class="icono_atomo">⚛️</span> 
                CIENCIAS<span>CAFFÉ</span>
                <span class="tag_cliente">CLIENTE</span>
            </div>
            
            <div class="info_usuario">
                <div class="contenedor_puntos">
                    <span class="emoji_puntos">🌟</span>
                    <span id="puntos_lealtad">150 <small>PUNTOS</small></span>
                </div>

                <button class="btn_carrito_flotante" onclick="toggleCarrito()">
                    🛒 <span id="conteo_flotante">0</span>
                </button>
                
                <button class="btn_logout" onclick="window.location.href='login.html'">
                    Cerrar Sesión
                    <span class="flecha_css"></span>                    
                </button>
            </div>
        </div>
    </nav>

    <main class="contenedor">
        <section class="catalogo">
            <h2>Menú del Día</h2>
            <div id="cuadricula_productos" class="cuadricula_productos"></div>
        </section>
    </main>

    <div id="carrito_overlay" class="carrito_overlay" onclick="toggleCarrito()"></div>
    <aside id="carrito_drawer" class="carrito_drawer">
        <div class="cabecera_drawer">
            <h3>🛒 Mi Carrito (<span id="conteo_carrito">0</span>)</h3>
            <button class="btn_cerrar" onclick="toggleCarrito()">×</button>
        </div>
        
        <div class="cuerpo_drawer">
            <div id="items_carrito" class="items_carrito">
                </div>
        </div>

        <div class="pie_drawer">
            <div class="fila_total">
                <span>Total a Pagar:</span>
                <span id="total_carrito">$0.00</span>
            </div>
            <div class="acciones_drawer">
                <button class="boton_limpiar" onclick="vaciarCarrito()">Vaciar Carrito</button>
                <button id="boton_finalizar" class="boton_pago" onclick="finalizarPedido()">
                    FINALIZAR PEDIDO
                </button>
            </div>
        </div>
    </aside>

    <section class="seccion_historial">
        <h3>📜 Historial de Compras</h3>
        <table class="tabla_historial">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Detalles</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="cuerpo_historial">
                </tbody>
        </table>
    </section>

    <script src="js/funcionalidades_cliente.js"></script>
</body>
</html>
