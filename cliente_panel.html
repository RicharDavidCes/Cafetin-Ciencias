<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pedido | Ciencias Caffé</title>
    <link rel="stylesheet" href="css/estilos_cliente.css">
</head>
<body>

    <nav class="barra_navegacion">
        <div class="logo">⚛️ CIENCIAS<span>CAFFÉ</span></div>
        <div class="info_usuario">
            <span id="puntos_lealtad">🌟 150 puntos</span>
            <button id="boton_cerrar_sesion" class="boton_cerrar_sesion">Cerrar Sesión</button>
        </div>
    </nav>

    <main class="contenedor">
        <section class="catalogo">
            <h2>Menú del Día</h2>
            <div id="cuadricula_productos" class="cuadricula_productos"></div>
        </section>

        <aside class="contenedor_carrito">
            <div class="cabecera_carrito">
                <h3>🛒 Mi Carrito (<span id="conteo_carrito">0</span>)</h3>
                <button id="boton_vaciar" class="boton_limpiar" onclick="vaciarCarrito()">Vaciar</button>
            </div>
            
            <div id="items_carrito" class="items_carrito">
                <p class="mensaje_vacio">Tu carrito está vacío</p>
            </div>

            <div class="pie_carrito">
                <div class="fila_total">
                    <span>Subtotal:</span>
                    <span id="total_carrito">$0.00</span>
                </div>
                <button id="boton_finalizar" class="boton_pago" onclick="finalizarPedido()">Finalizar Pedido</button>
            </div>
        </aside>
    </main>

    <section class="seccion_historial">
        <h3>📜 Historial de Compras</h3>
        <table class="tabla_historial">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Detalles</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="cuerpo_historial">
                <tr>
                    <td>15/02/2026</td>
                    <td>2x Empanada de Queso, 1x Café Grande</td>
                    <td>$7.50</td>
                </tr>
            </tbody>
        </table>
    </section>

    <script src="js/funcionalidades_cliente.js"></script>
</body>
</html>
