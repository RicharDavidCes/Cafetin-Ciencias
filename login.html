<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Staff | Ciencias Caffé</title>
    <link rel="stylesheet" href="css/estilos_login.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <span class="logo-icon">⚛️</span> CIENCIAS<span>CAFFÉ</span>
            </a>
        </div>
        <a href="index.html" class="boton_volver">Volver al Inicio</a>
    </nav>

    <main class="contenedor_login">
        <div class="rejilla_login">
            <div class="login_cabezera">
                <h2>Acceso al Sistema</h2>
                <p>Introduce tus credenciales de Staff</p>
            </div>

            <form id="login_Formulario">
                <div class="grupo_input">
                    <label for="username">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ej: adminRoot" required>
                </div>

                <div class="grupo_input">
                    <label for="password">Contraseña</label>
                    <div class="clave">
                        <input type="password" id="clave" placeholder="••••••••" required>
                        <button type="button" id="suicheClave" class="clave_suiche">👁️</button>
                    </div>
                </div>

                <div id="error_mensaje" class="mensaje_error"></div>

                <button type="submit" class="boton_login">Ingresar al Cafetín</button>
            </form>
            
            <div class="login_footer_texto">
                <p>¿Problemas con tu acceso? Contacta a Soporte Técnico.</p>
            </div>
        </div>
    </main>

    <footer class="main_footer">
        <div class="footer-info">
            <p><strong>Ubicación:</strong> Al frente de Plaza la Langosta</p>
            <div class="sociales">
                <span>📸</span> <span>🐦</span> <span>🎥</span>
            </div>
        </div>
        <p class="copy">© 2024 Cafetín Ciencias UCV - Área Restringida.</p>
    </footer>

    <script src="js/funcionalidades_login.js"></script>
</body>
</html>
