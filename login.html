<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Staff | Ciencias Caffé</title>
    <link rel="stylesheet" href="css/estilos_login.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <span class="logo-icon">⚛️</span> CIENCIAS<span>CAFFÉ</span>
            </a>
        </div>
        <a href="index.html" class="btn-back">Volver al Inicio</a>
    </nav>

    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Acceso al Sistema</h2>
                <p>Introduce tus credenciales de Staff</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="Ej: adminRoot" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="toggle-password">👁️</button>
                    </div>
                </div>

                <div id="errorMessage" class="error-message"></div>

                <button type="submit" class="btn-login">Ingresar al Cafetín</button>
            </form>
            
            <div class="login-footer-text">
                <p>¿Problemas con tu acceso? Contacta a Soporte Técnico.</p>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-info">
            <p><strong>Ubicación:</strong> Al frente de Plaza la Langosta</p>
            <div class="socials">
                <span>📸</span> <span>🐦</span> <span>🎥</span>
            </div>
        </div>
        <p class="copy">© 2024 Cafetín Ciencias UCV - Área Restringida.</p>
    </footer>

    <script src="js/funcionalidades_login.js"></script>
</body>
</html>
