<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta | Staff Ciencias</title>
    <link rel="stylesheet" href="css/estilos_caja.css">
</head>
<body>

    <nav class="barra_navegacion">
        <div class="nav_wrapper">
            <div class="logo">
                <span class="icono_atomo">⚛️</span> 
                CIENCIAS<span>CAFFÉ</span> 
                <span class="tag_admin">CAJA</span>
            </div>
            
            <div class="acciones">
                <button class="btn_logout" onclick="window.location.href='login.html'">
                    Cerrar Sesión
                    <span class="flecha_css"></span>
                </button>
            </div>
        </div>
    </nav>

    <main class="contenedor_pos">
        <section class="area_seleccion">
            <h3>Selección de Productos</h3>
            <div class="pestanas_categorias">
                <button id="pestana_todo" class="pestana activa" onclick="filtrarProductos('todos')">Todo</button>
                <button class="pestana" onclick="filtrarProductos('comida')">Comida</button>
                <button class="pestana" onclick="filtrarProductos('bebida')">Bebidas</button>
            </div>
            <div id="cuadricula_pos" class="cuadricula_pos">
                </div>
        </section>

        <aside class="area_facturacion">
            <div class="cabecera_factura">
                <h3>FACTURACIÓN</h3>
                <span class="fecha_actual" id="fecha_pos"></span>
            </div>

            <div class="contenedor_tabla_factura">
                <table class="tabla_factura">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th class="txt_centro">Cant.</th>
                            <th class="txt_derecha">Subt.</th>
                            <th class="txt_centro">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="items_factura">
                        </tbody>
                </table>
            </div>

            <div class="modulo_pago">
                <div class="resumen_detallado">
                    <div class="fila_resumen">
                        <span>Subtotal:</span>
                        <span id="subtotal_pos">$0.00</span>
                    </div>
                    <div class="fila_resumen total">
                        <span>TOTAL A PAGAR:</span>
                        <span id="total_pos">$0.00</span>
                    </div>
                </div>
                
                <button id="boton_emitir" class="boton_emitir" onclick="emitirRecibo()">
                    <span class="icono_recibo">📄</span> EMITIR RECIBO
                </button>
            </div>
        </aside>
    </main>

    <script src="js/funcionalidades_caja.js"></script>
</body>
</html>
