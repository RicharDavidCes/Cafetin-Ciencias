<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta | Staff Ciencias</title>
    <link rel="stylesheet" href="css/estilos_caja.css">
</head>
<body>

    <nav class="barra_navegacion">
        <div class="logo">⚛️ CIENCIAS<span>CAFFÉ</span> <small>| CAJA</small></div>
        <div class="info_usuario">
            <span>👤 Operador: <strong id="nombre_cajero">Cajero_01</strong></span>
            <button id="boton_salir" class="boton_salir" onclick="window.location.href='login.html'">Salir</button>
        </div>
    </nav>

    <main class="contenedor_pos">
        <section class="area_seleccion">
            <h3>Selección de Productos</h3>
            <div class="pestanas_categorias">
                <button id="pestana_todo" class="pestana activa" onclick="filtrarProductos('todos')">Todo</button>
                <button class="pestana" onclick="filtrarProductos('comida')">Comida</button>
                <button class="pestana" onclick="filtrarProductos('bebida')">Bebidas</button>
            </div>
            <div id="cuadricula_pos" class="cuadricula_pos">
                </div>
        </section>

        <aside class="area_facturacion">
            <h3>Resumen de Venta</h3>
            <div class="contenedor_tabla_factura">
                <table class="tabla_factura">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cant.</th>
                            <th>Subt.</th>
                            <th>Acción</th> </tr>
                    </thead>
                    <tbody id="items_factura">
                        </tbody>
                </table>
            </div>

            <div class="resumen_factura">
                <div class="fila_resumen total">
                    <span>TOTAL:</span>
                    <span id="total_pos">$0.00</span>
                </div>
                <button id="boton_emitir" class="boton_emitir" onclick="emitirRecibo()">
                    📄 EMITIR RECIBO
                </button>
            </div>
        </aside>
    </main>

    <script src="js/funcionalidades_caja.js"></script>
</body>
</html>
