<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Ciencias Caffé</title>
    <link rel="stylesheet" href="css/estilos_admin.css">
</head>
<body>

    <nav class="barra_navegacion">
        <div class="nav_wrapper">
            <div class="logo">
                <span class="icono_atomo">⚛️</span> 
                CIENCIAS<span>CAFFÉ</span> 
                <span class="tag_admin">ADMIN</span>
            </div>
            
            <div class="acciones">
                <button class="btn_logout" onclick="window.location.href='login.html'">
                    Cerrar Sesión
                    <span class="flecha_css"></span>
                </button>
            </div>
        </div>
    </nav>

    <main class="contenedor_admin">
        <section class="tarjeta_admin refactor_formulario">
            <div class="cabecera_formulario">
                <span class="badge_nuevo">NUEVO</span>
                <h3>Gestión de Inventario</h3>
                <p>Añade productos al catálogo de la facultad</p>
            </div>

            <form id="formulario_producto" class="formulario_admin">
                <div class="grupo_entrada_moderno">
                    <input type="text" id="admin_nombre" required placeholder=" ">
                    <label for="admin_nombre">Nombre del Producto</label>
                    <span class="linea_foco"></span>
                </div>

                <div class="fila_doble">
                    <div class="grupo_entrada_moderno">
                        <input type="number" id="admin_precio" step="0.01" required placeholder=" ">
                        <label for="admin_precio">Precio ($)</label>
                        <span class="linea_foco"></span>
                    </div>

                    <div class="grupo_entrada_moderno">
                        <select id="admin_categoria" required>
                            <option value="comida">Comida</option>
                            <option value="bebida">Bebida</option>
                            <option value="snack">Snack</option>
                        </select>
                        <label class="label_fijo">Categoría</label>
                    </div>
                </div>

                <div class="grupo_entrada_moderno">
                    <input type="text" id="admin_url" required placeholder=" ">
                    <label for="admin_url">URL de Imagen</label>
                    <span class="linea_foco"></span>
                </div>

                <button type="submit" class="boton_guardar_moderno">
                    <span>Guardar Producto</span>
                    <div class="icono_guardar">✓</div>
                </button>
            </form>
        </section>

        <section class="tarjeta_admin refactor_tabla">
            <div class="cabecera_gestion">
                <div class="titulo_seccion">
                    <span class="icono_gestion">📊</span>
                    <div>
                        <h3>Gestión de Contenido</h3>
                        <p>Monitorea productos y opiniones de usuarios</p>
                    </div>
                </div>
                
                <div class="pestanas_modernas">
                    <button id="pestana_productos" class="btn_pestana activa" onclick="cambiarVistaAdmin('Producto')">
                        Menú
                    </button>
                    <button id="pestana_resenas" class="btn_pestana" onclick="cambiarVistaAdmin('Reseña')">
                        Reseñas
                    </button>
                    <div class="indicador_pestana"></div>
                </div>
            </div>

            <div class="envoltura_tabla_moderna">
                <table class="tabla_admin_premium">
                    <thead>
                        <tr>
                            <th>Ítem / Usuario</th>
                            <th>Tipo</th>
                            <th>Precio / Comentario</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo_items_admin">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/funcionalidades_admin.js"></script>
</body>
</html>
