<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Ciencias Caffé</title>
    <link rel="stylesheet" href="css/estilos_admin.css">
</head>
<body>

    <nav class="barra_navegacion">
        <div class="logo">⚛️ CIENCIAS<span>CAFFÉ</span> <small>| ADMIN</small></div>
        <button class="boton_cerrar_sesion" onclick="window.location.href='login.html'">Cerrar Sesión</button>
    </nav>

    <main class="contenedor_admin">
        <section class="tarjeta_admin">
            <h3>➕ Agregar Nuevo Producto</h3>
            <form id="formulario_producto" class="formulario_admin">
                <div class="grupo_entrada">
                    <label>Nombre del Producto</label>
                    <input type="text" id="admin_nombre" placeholder="Ej: Galleta de Avena" required>
                </div>
                <div class="grupo_entrada">
                    <label>Precio ($)</label>
                    <input type="number" id="admin_precio" step="0.01" placeholder="0.00" required>
                </div>
                <div class="grupo_entrada">
                    <label>URL de la Imagen (simulada en /img/)</label>
                    <input type="text" id="admin_url" placeholder="img/producto.png" required>
                </div>
                <button type="submit" class="boton_guardar">Guardar en Menú</button>
            </form>
        </section>

        <section class="tarjeta_admin">
            <div class="cabecera_tarjeta_admin">
                <h3>🗑️ Gestión de Contenido</h3>
                <div class="pestanas_admin">
                    <button id="pestana_productos" class="boton_pestana activa" onclick="cambiarVistaAdmin('Producto')">Menú</button>
                    <button id="pestana_resenas" class="boton_pestana" onclick="cambiarVistaAdmin('Reseña')">Reseñas</button>
                </div>
            </div>
            <div class="envoltura_tabla">
                <table class="tabla_admin">
                    <thead>
                        <tr>
                            <th>Ítem / Usuario</th>
                            <th>Tipo</th>
                            <th>Precio / Comentario</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo_items_admin">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/funcionalidades_admin.js"></script>
</body>
</html>
